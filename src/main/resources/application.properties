spring.config.import=optional:file:.env[.properties]

spring.application.name=bookresearcher
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookresearcher?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${DB_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
